services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d secure_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://auth_user:change_me_local_only@db:5432/secure_auth
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data: